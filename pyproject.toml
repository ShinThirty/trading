[project]
name = "trading-mcp"
version = "0.1.0"
description = "MCP server for trading stocks and options on Webull"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "httpx[http2]",
]

[project.scripts]
trading-mcp = "trading_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_mcp"]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
