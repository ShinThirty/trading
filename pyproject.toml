[project]
name = "trading-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[tool.ty.environment]
extra-paths = [
    "packages/trading-clients/src",
    "packages/trading-mcp/src",
    "packages/option-monitor/src",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
