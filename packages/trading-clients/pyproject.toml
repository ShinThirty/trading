[project]
name = "trading-clients"
version = "0.1.0"
description = "Shared API clients for Webull, Tradier, Finnhub, FMP, FRED, and Alpha Vantage"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]",
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_clients"]
