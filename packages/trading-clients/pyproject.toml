[project]
name = "trading-clients"
version = "0.1.0"
description = "Shared API clients for Webull, Tradier, Finnhub, FMP, FRED, and Alpha Vantage"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]",
    "openpyxl",
    "pdfplumber",
]

[project.optional-dependencies]
# Playwright is only needed by sentiment_client (CBOE p/c, AAII — sites
# require a real-browser context). Opt-in extra so trading-alerts' Lambda
# build stays lean.
sentiment = ["playwright>=1.48"]
# websockets is only needed by the streaming transports: dxlink_stream_client
# (the scalper's live /MES feed) and tradier_stream_client (equity streaming).
# Opt-in extra for the same reason — trading-alerts never imports it.
streaming = ["websockets>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_clients"]
