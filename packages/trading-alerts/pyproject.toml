[project]
name = "trading-alerts"
version = "0.1.0"
description = "AWS Lambda fleet of trigger-based market/macro alerts to Discord"
requires-python = ">=3.13"
dependencies = [
    "trading-clients",
    "boto3>=1.35",
    "pynacl>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_alerts"]

[tool.uv.sources]
trading-clients = { workspace = true }
