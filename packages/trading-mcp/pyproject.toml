[project]
name = "trading-mcp"
version = "0.1.0"
description = "MCP server for trading stocks and options on Webull"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2",
    "trading-clients",
    "yfinance>=1.2",
    "youtube-transcript-api>=1.2.4",
    "asyncpraw>=7.8",
]

[project.scripts]
trading-mcp = "trading_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_mcp"]

[tool.uv.sources]
trading-clients = { workspace = true }
