[project]
name = "trading-scalper"
version = "0.3.1"
description = "Local paper entry-detector for intraday SPY/QQQ options scalps"
requires-python = ">=3.13"
dependencies = [
    "trading-clients[streaming]",
    "pyyaml>=6",
]

[project.scripts]
trading-scalper = "trading_scalper.cli:main"
trading-scalper-scorecard = "trading_scalper.scorecard:main"

[dependency-groups]
# matplotlib powers the scorecard's optional --chart export only; the daemon and
# the text scorecard have no plotting dependency, so it stays out of the runtime
# deps (and the wheel). Installed by a plain `uv sync`; a lazy import in
# scorecard.py prints an install hint if it's ever missing.
dev = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_scalper"]

[tool.uv.sources]
trading-clients = { workspace = true }
