[project]
name = "trading-scalper"
version = "0.1.0"
description = "Local assist-only daemon for intraday SPY/QQQ options scalp discipline"
requires-python = ">=3.13"
dependencies = [
    "trading-clients[streaming]",
    "pyyaml>=6",
]

[project.scripts]
trading-scalper = "trading_scalper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_scalper"]

[tool.uv.sources]
trading-clients = { workspace = true }
