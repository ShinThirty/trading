[project]
name = "option-monitor"
version = "0.1.0"
description = "AWS Lambda service to monitor option positions and alert on strike proximity"
requires-python = ">=3.12"
dependencies = [
    "trading-clients",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/option_monitor"]

[tool.uv.sources]
trading-clients = { workspace = true }
